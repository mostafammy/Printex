services:
  postgres:
    image: postgres:16
    container_name: printex-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: printex_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d printex_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - printex-test-postgres:/var/lib/postgresql/data

volumes:
  printex-test-postgres:
